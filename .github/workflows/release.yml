name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Typecheck + tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Prebuild
        env:
          APP_VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        env:
          EXPO_PUBLIC_GITHUB_CLIENT_ID: ${{ vars.GH_OAUTH_CLIENT_ID }}
          APP_VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT="riscado-${{ steps.v.outputs.version }}.apk"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" "$APK"
            rm release.jks
          else
            echo "::warning::Sem keystore nos secrets, APK assinado com chave debug"
            cp "$APK" "$OUT"
          fi
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK" --title "Riscado $GITHUB_REF_NAME" --generate-notes
